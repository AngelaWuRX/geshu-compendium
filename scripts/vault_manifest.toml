# The hello-algo reading notes, pulled in from the `python` vault — the only
# cross-vault include on the site. It sat in its own one-note "Python" section
# until it was moved here.
#
# Worth knowing what it currently *is*: the four chapters written up so far are
# Encounter Algorithms, Complexity Analysis, Data Structure, and Array & Linked
# List — which overlap the Data Structures section (asymptotic, arraylist,
# linkedlist, data-structure) more than they do anything here. The reading plan
# queues Backtracking, DP, Divide & Conquer and Greedy, so this is where the
# note is heading. Move the section if that stops being true.
include_from = [
  { vault = "python", paths = ["learning/Python & DSA/hello-algo Notes.md"] },
]

# ── Transforms below apply to the whole section, but exist for the hello-algo
# note only. Verified non-colliding against all eight cs notes above:
# strip_headings is exact-full-line and matches 0 of them; the embed patterns
# match 0 files in the cs vault. Re-check if either list grows.

# The top half is a sprint-week progress tracker, not content.
strip_headings = ["## Progress (mapped to the sprint weeks)", "## Also worth a pass", "### (chapter name)"]

# hello-algo is CC BY-NC-SA, so this publishes the author's own commentary and
# NOT the book's material. Concretely: all five image embeds are dropped —
# "Running time comparison", "Data structure classification", "Memory space",
# "logn/n! time complexity" are the book's own figures, not screenshots of
# anything original. The prose that stays is hand-typed reading commentary
# ("It might run slow, but still be constant!!!"), which is the point of a
# reading note.
drop_lines_matching = [
  '!\[\[Running time comparison',
  '!\[\[logn time complexity',
  '!\[\[n! time complexity',
  '!\[\[Data structure classification',
  '!\[\[Memory space',
]


# ─── Model → Machine Learning ────────────────────────────────────────────────────────
# S1/S2 held back: a framework whose worked example is empty, and a to-do list
# with an empty python block. The other 11 are substantive.
[[section]]
title   = "Machine Learning"
slug    = "machine-learning"
group   = "Reference"
vault   = "python"
include = [
  "learning/ml/01 Probability.md",
  "learning/ml/02 MLE & MAP.md",
  "learning/ml/03 Linear Regression & Regularization.md",
  "learning/ml/04 Clustering.md",
  "learning/ml/05 Classifiers.md",
  "learning/ml/06 Optimization.md",
  "learning/ml/07 Neural Networks.md",
  "learning/ml/08 CNNs & ResNet.md",
  "learning/ml/09 Transformers & Attention.md",
  "learning/ml/10 Language Models.md",
  "learning/ml/11 Self-Supervised Learning.md",
]
# "## Notes" is the one genuinely empty section (a single "- " bullet).
# "## → add must-knows to [[ML]]" is the porting checklist footer.
strip_headings = ["## Notes", "## → add must-knows to [[ML]]"]

# `- [ ]` here is a study artifact wrapped around real content, not an unfinished
# task list: the Subtopics sections ARE the substance of these notes. Published
# as checkboxes they read as abandoned; deboxing turns "- [ ] x" into "- x".
debox = true

# The breadcrumb line also carries `ref: attention_is_all_you_need.pdf`, which
# points at a denylisted PDF. Nav replaces the breadcrumb; link arXiv if the
# reference is wanted back.
drop_lines_matching = [
  '\[\[_ML Index',
]

# These parentheticals annotate where content came from — a paper cheatsheet, a
# margin in a handwritten notebook, an Obsidian mechanic. Deliberately scrubbed
# here rather than deleted from the vault: in Obsidian they tell you which
# source a section came from, which is worth keeping. They just mean nothing to
# a reader who has never seen the notebook.
scrub_regex = [
  '\s*\((?:from )?(?:your |the )?cheatsheet[^)]*\)',   # "(cheatsheet §9.1)", "(from cheatsheet §2)"
  '\s*\(from your [^)]*\)',                            # "(from your red notes)"
  '\s*\(collapse = flashcard\)',                       # an Obsidian mechanic
]


# ─── Networks ────────────────────────────────────────────────────────────────
# The flagship. Already in the target format: YAML frontmatter, faceted tags,
# zero wikilinks, zero embeds.
#
# The homework coupling runs deeper than the "## 7" section suggests. Of 78
# citations across the 18 notes, only 47 are in section 7. The rest:
#   - 22 lemma headings carry a pointer suffix: "### Perfect matching count (HW5 Q2)".
#     The lemma itself is textbook maths; the parenthetical is the only HW-specific
#     part, so scrubbing it leaves the content whole.
#   - 3 whole sections ARE a homework problem ("## HW8 P1: Direct (overlap-method)
#     proof..."). Those go entirely — they're per-problem walkthroughs.
#   - a handful of prose asides, incl. one pointing at a corrected HW solution.
[[section]]
title   = "Networks"
slug    = "networks"
vault   = "spring2026"
# Was top-level, on the grounds that 18 notes / 15k words is over half the site
# and is neither programming nor ML modelling. It now joins the other three
# under Reference — not a demotion in quality (it is still the most developed
# writing here) but a statement about what the site is *for*: the capability
# map leads, and course material is the input behind it. `navigation.indexes`
# still folds the landing page below into the section header, one level deeper.
group   = "Reference"
include = ["networks/topics/*.md"]

# The landing page: 30-odd methods, which topic each one powers, and a decision
# tree from question shape to method. It says what 18 parallel notes can't — that
# they're mostly the same few ideas in different clothes. Written in May and left
# unpublished; the [[patch]] below was written for it and never fired, because no
# section included the file.
index = "networks/Final Method Index.md"

# The template's spine is a triage protocol for a timed final: it teaches you to
# recognize a question type and execute, not to understand the topic. The course
# is over and these notes are a learning track now, so the exam slots go. What's
# left — proof moves, lemmas, common mistakes, memory hooks — earns its place
# either way.
#
# Matching is exact-full-line against VAULT text, before renumbering (sync_vault
# strips at :758, renumbers at :777). So these are the vault's numbers, not the
# ones the site shows: "## 9. What I should try first on an exam" publishes as
# "## 8." today. A near-miss here is a silent no-op, not an error.
#
# Exactness is also what keeps "## 9. Common mistakes" (11 Small World) — the
# same number, a section worth keeping.
strip_headings = [
  "## 7. Homework examples",
  "## 3. Main question types",
  "## 4. How to recognize this topic in a problem",
  "## 9. What I should try first on an exam",
  # Same idea, unnumbered — the six notes that never took the template.
  "## Recognition signals",
  "## 8. Recognition signals",   # 11 Small World
  "## 9. Recognition signals",   # 09 Directed Networks
  # The index page's own two exam sections. Publishing an exam-framed hub on top
  # of notes we just de-examed would only contradict itself. Its other five
  # sections are about how the topics relate, which is the point of the page.
  #
  # "## 7." is the last heading in that file, and a section runs to the next
  # same-or-higher heading OR to EOF — so this strip takes everything after it
  # too. That's correct, but it means the index page must not end in trailing
  # prose: anything below §7 is published nowhere and edited into a void.
  "## 6. Exam pitfall checklist",
  "## 7. Strategic exam advice",
]

# These notes number their sections, so removing #7 leaves "1..6, 8, 9, 10" —
# a gap that advertises the removal. Renumber to run consecutively.
renumber_headings = true

# Sections whose title IS a homework problem. Prefix-matched because the title
# varies per file.
strip_heading_prefixes = ["## HW", "### HW"]

# Kill whole lines that only exist to point at homework or its solutions.
drop_lines_matching = [
  "had a typo in the original",       # "...study the corrected solution" (12 Pref Attachment)
  "HW10/11 references \\(if any\\)",  # a to-do to self, not content (08 Diameter)
]

# Where a citation is load-bearing in the sentence, deleting it leaves debris
# ("Why this is harder than." / "argument (the bulk of)"). Name the replacement
# instead of letting a regex guess. Each entry is [pattern, replacement]; the
# script warns if one stops matching, so a vault edit can't silently skip it.
rewrite = [
  ['\(the hard part, HW3 Q3 ii-v\)',        '(the hard part)'],
  ['\s*\(the bulk of HW3 Q3\)',             ''],
  ['\s*\(HW7 P2, P3\)',                     ''],
  ['\s*\(HW7 P3, HW8 P3\)',                 ''],
  ['Why this is harder than HW7 P2\.',      'Why this is harder than the plain giant-component argument.'],
  ['\(final outbreak size, HW7 P3 bonus\)', '(final outbreak size)'],
  ['Proof: repeat HW7 P2 \(iv\)',           'Proof: repeat the giant-component argument (iv)'],
  ['\s*\(HW7 P3 — Lemma 7\.2\)',            ''],
  ['or the corrected HW5 Q3\(iv\) approach ', ''],
  # Pointer parentheticals the generic scrub can't reach: they carry words, not
  # just a problem number.
  ['\s*\(HW3 Bonus\)',                      ''],
  ['\s*\(Eq\. 3 from HW5\)',                ''],
  ['\s*\(Lemma 1\.1 from HW6\)',            ''],
  # '(cite Lemma 7.1 from HW7)' lived in 06's "try first on an exam" list, which
  # strip_headings now takes whole. The rule went stale the moment that section
  # did, and the stale-rewrite warning is what surfaced it.
  ['\s*bound from HW1\.',                   ' bound.'],
  # "(post-midterm)" is a scope label and "see midterm SIR note" a cross-ref by
  # exam scope — both name the exam to a reader who has no idea what it was.
  ['\s*\(post-midterm\)',                   ''],
  ['see midterm SIR note',                  'see the SIR and Epidemics note'],
]

# Only self-contained pointer parentheticals reach here — "(HW5 Q2)" appended to
# a lemma heading. The lemma is textbook maths; the parenthetical is the whole
# of the HW-specific part, so removing it leaves a complete sentence.
# The [\d.-]* tail covers sub-part numbering like "(HW6 Q2.3.2-3)".
scrub_regex = [
  '\s*\((?:HW|hw)\s?\d+\s*[PQ]?[\d.-]*\)',
]

# Deliberately absent from this section:
#   networks/hw/**                  — derivative of the staff solution PDFs
#   networks/Midterm Learning Guide — a walkthrough of the real midterm
#   networks/Midterm Method Index   — subsumed by the Final index
# All three are also in [denylist] so a stray include can't resurrect them.


# ─── Per-file surgery ────────────────────────────────────────────────────────

# The "HW" column indexes staff problems by number, and some row names are
# defined by them ("Multiplicative Chernov (HW7 P1)").
[[patch]]
file = "backend/data/vaults/spring2026/networks/Final Method Index.md"
drop_table_columns = ["HW"]
scrub_regex = ['\s*\((?:HW|hw)\s?\d+\s*P?\d*\)']

# `### Solving problems` embeds a screenshot of a course problem's answer.
[[patch]]
file = "backend/data/vaults/cs/cs61b/OOP.md"
drop_embeds = ["OOP eg answer.png"]

[[patch]]
file = "backend/data/vaults/cs/cs61b/Asymptotic.md"
drop_embeds = ["asymptotic solution.png"]


# ─── Denylist ────────────────────────────────────────────────────────────────
# A gate, not a filter. A hit anywhere stops the whole run and writes nothing.
# An include/deny intersection means the manifest is wrong; that is an error,
# not a silent skip.
[denylist]
paths = [
  # Staff / instructor material
  "backend/data/vaults/spring2026/networks/hw/**",
  "backend/data/vaults/spring2026/networks/Midterm Learning Guide.md",
  "backend/data/vaults/spring2026/networks/Midterm Method Index.md",
  "backend/data/vaults/spring2026/networks/midterm-solutions.pdf",
  "backend/data/vaults/spring2026/networks/lecture_notes/**",
  "backend/data/vaults/spring2026/machine_learning/lec/**",
  "backend/data/vaults/spring2026/machine_learning/hw/**",
  "backend/data/vaults/spring2026/machine_learning/reading/**",
  "backend/data/vaults/spring2026/machine_learning/Guideline.md",
  "backend/data/vaults/spring2026/machine_learning/hw4_written_student.tex",
  "backend/data/vaults/cs/Files/**",
  "backend/data/vaults/cs/Screenshot/OOP eg answer.png",
  "backend/data/vaults/cs/Screenshot/asymptotic solution.png",
  "backend/data/vaults/cs/Untitled.md",
  # Own work that stays private.
  #
  # The python vault's reorganization renamed every entry in this group:
  # `application_plan/` and the loose `profile_strategy.md` are now all under
  # `application/`, and `daily_track/` moved under `learning/`. The old
  # "00 Dashboard.md" and "01 Sprint Plan.md" no longer exist at all — they
  # are not omissions.
  "backend/data/vaults/python/application/**",
  "backend/data/vaults/python/learning/daily_track/**",
  # Source for the Postmortem Agent project page. That page is hand-written
  # and scrubbed; this is the unscrubbed working vault behind it and must
  # never be converted, even if a future include glob widens.
  "backend/data/vaults/python/learning/System Design (DDIA)/**",
  # Copyright
  "backend/data/vaults/python/learning/pdf/**",
  # Blanket
  "**/*.pdf",
  "**/*.tex",
  "**/midterm*",
  "**/*_sol*",
  "**/resume*",
]

# Regex, case-insensitive, applied to every rendered byte before any write.
# A hit reports file+line+which-pattern, never the matched text — that would
# copy the thing we're protecting into terminal scrollback and CI logs.
fail_patterns = [
  'ruoxi',
  'angela wu',
  'AngelaWuRX',
  '510[- ]?499',
  'berkeley\.edu',
  'Shixiang',
  'AgentHLE',
  'NeurIPS',
  # Deliberately broad. An earlier version matched only the "HW7 P2" shape and
  # sailed straight past "(HW3 Bonus)", "(Eq. 3 from HW5)", "(cite Lemma 7.1
  # from HW7)" and a stray "HW10/11 references" to-do. Any mention of a
  # homework or the midterm is a citation; there is no innocent use.
  '\bHW ?\d+',
  '\bmidterm\b',
  'from your (red|bottom-right|margin)',   # second-person refs to private artifacts
  'Tell me if you want',           # assistant chatter left in _ML Index
]
