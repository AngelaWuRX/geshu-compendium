# What publishes, where it lands, and what must never leave the vault.
#
# This file is policy. It is meant to be read and argued with, which is why it
# lives here as data rather than as a dict inside sync_vault.py.
#
# Sections use explicit per-file include lists rather than directory globs. That
# is not fussiness: in the CS vault the folder tree contradicts the link graph
# (cs61b/Graphs.md links to Graph Traversal.md, Minimum spanning trees.md and
# Single-source shortest paths.md, all of which sit at the vault root), so a
# glob over cs61b/ would miss half the section and a glob over the root would
# sweep in a CS189 exam cram sheet.

[output]
docs_root  = "docs/notes"
assets_dir = "docs/assets/images"

# Roots are repo-relative (sync_vault resolves them as REPO / root) and the
# directory name matches `name`, so a section's `vault = "cs"` reads straight
# through to the folder on disk.
#
# These used to sit at the repo root as "<vault> copy". The suffix was load-
# bearing — it keyed the iCloud staleness check — but it also meant every path
# needed quoting, and it hid the fact that the three vaults are one dataset.
# The iCloud twin is now named explicitly per vault instead of inferred.
[[vault]]
name  = "cs"
root  = "backend/data/vaults/cs"
icloud = "Computer Science"

# No iCloud twin: unlike the other two this vault only exists here, so there is
# no upstream to be stale against and nothing to re-copy from if it is lost.
[[vault]]
name = "python"
root = "backend/data/vaults/python"

[[vault]]
name  = "spring2026"
root  = "backend/data/vaults/spring2026"
icloud = "spring2026"


# ─── Programming → Python ────────────────────────────────────────────────────
# Retired. It held exactly one note — the hello-algo reading notes — which now
# publishes under Algorithms via that section's `include_from`. A section whose
# only member moves elsewhere is a nav entry with nothing behind it, so it goes
# rather than lingering as an empty heading.

# ─── Programming → Data Structures (CS61B) ───────────────────────────────────
[[section]]
title   = "Data Structures"
slug    = "data-structures"
# All four sections now share one group. The site is organised by engineering
# capability (docs/notes/foundations, backend, ai-engineering, …), and these
# course-shaped notes are input to that, not part of it — so they collapse into
# a single Reference branch rather than keeping the old Programming / Model
