  "cs61b/Data structure.md",
  "cs61b/OOP.md",
  "cs61b/Asymptotic.md",
  "cs61b/ArrayList.md",
  "cs61b/LinkedList.md",
  "cs61b/Heap.md",
  "cs61b/Hashing.md",
  "cs61b/Search Trees.md",
  "Red_Black Trees.md",
  "B-Trees.md",
  "Union-Find (Disjoint Set).md",
  # The sort family. Individually thin, but each is linked from
  # "Comparison-based sort" — leaving them out turned those links into dangling
  # plain text and made the section read as half-written.
  "cs61b/Sorting and Selecting.md",
  "cs61b/Comparison-based sort.md",
  "cs61b/QuickSort.md",
  "cs61b/MergeSort.md",
  "cs61b/HeapSort.md",
  "cs61b/InsertionSort.md",
  "cs61b/RadixSort.md",
]
# Not included, all currently 0 bytes. They are linked *from* the notes above;
# the resolver degrades those links to plain text rather than publishing blank
# pages. Add them here the day they gain content:
#   Stack.md  Queue.md  Tries.md
#
# Also held back: the ADT cluster (ADT.md, Interface.md, Class.md,
# Implementation Layer.md, Java.md). Those four re-explain the same
# List/Set/Map/Stack/Queue/Deque mapping — Java.md does it three times over in
# ~40% of its 318 lines — and want consolidating into one page before they're
# worth publishing. "Data structure.md" above covers the same ground once.


